[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gimle-deck"
version = "0.1.0"
description = "Build manifest-driven HTML slide decks and verified PDFs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Gimle Labs" },
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/arnovich/gimle-deck"

[project.scripts]
gimle-deck = "gimle_deck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
files = ["src/gimle_deck"]
no_implicit_optional = true
warn_unused_ignores = true
